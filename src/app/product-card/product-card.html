<div class="card h-100 shadow-sm">
  <img [src]="product.thumbnail" [alt]="product.title" class="card-img-top product-img" />

  <div class="card-body d-flex flex-column">
    <span class="badge bg-secondary mb-2 align-self-start">{{ product.category }}</span>
    <h6 class="card-title fw-bold">{{ product.title }}</h6>
    <p class="card-text text-muted small flex-grow-1">{{ product.description }}</p>

    <div class="d-flex align-items-center gap-1 mb-2">
      <span class="text-warning">★</span>
      <small class="text-muted">{{ product.rating }}</small>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-auto">
      <span class="fs-5 fw-bold text-primary">{{ product.price | currency:'USD' }}</span>

      <!-- Si no hay stock se muestra el badge, sino el botón de agregar -->
      @if (product.stock === 0) {
        <span class="badge bg-danger">Sin stock</span>
      } @else {
        <button class="btn btn-primary btn-sm" (click)="alAgregar()">
          Agregar
        </button>
      }
    </div>
  </div>
</div>
